<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <!-- Light Orange Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5B4"/>
      <stop offset="50%" style="stop-color:#FFD59E"/>
      <stop offset="100%" style="stop-color:#FFC773"/>
    </linearGradient>
    
    <!-- Temple Gradient -->
    <linearGradient id="templeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA726"/>
      <stop offset="50%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
    
    <!-- Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Decorative Circles -->
  <circle cx="100" cy="100" r="80" fill="url(#glow)"/>
  <circle cx="700" cy="500" r="120" fill="url(#glow)"/>
  
  <!-- Main Card (Navy Blue) -->
  <rect x="250" y="150" width="300" height="300" rx="30" fill="#0A1E3F" filter="url(#shadow)"/>
  <rect x="250" y="150" width="300" height="300" rx="30" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Temple Icon - 3D -->
  <g transform="translate(400, 300)">
    <!-- Base Platforms -->
    <rect x="-60" y="50" width="120" height="10" rx="2" fill="#8B5A2B"/>
    <rect x="-55" y="40" width="110" height="10" rx="2" fill="#A0703A"/>
    <rect x="-50" y="30" width="100" height="10" rx="2" fill="#8B5A2B"/>
    <rect x="-45" y="20" width="90" height="10" rx="2" fill="#A0703A"/>
    
    <!-- Temple Body -->
    <path d="M -40 20 Q -40 -40 0 -65 Q 40 -40 40 20 Z" 
          fill="url(#templeGrad)" 
          stroke="#D4AF37" 
          stroke-width="2"/>
    
    <!-- Door -->
    <rect x="-15" y="-10" width="30" height="30" rx="3" fill="#4A2810"/>
    <rect x="-12" y="-7" width="24" height="25" rx="2" fill="#2A1508"/>
    
    <!-- Golden Stripes -->
    <path d="M -30 -10 L 30 -10" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
    <path d="M -25 -20 L 25 -20" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <path d="M -18 -30 L 18 -30" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Kalash (Spire) -->
    <circle cx="0" cy="-72" r="7" fill="#D4AF37"/>
    <polygon points="0,-95 -7,-72 7,-72" fill="#FFD700"/>
    <circle cx="0" cy="-98" r="3.5" fill="#FFD700"/>
    <rect x="-4" y="-68" width="8" height="5" fill="#B8941F"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="520" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0A1E3F" text-anchor="middle" opacity="0.9">
    Siyaram Palace
  </text>
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="14" fill="#0A1E3F" text-anchor="middle" opacity="0.6" letter-spacing="4">
    HOTEL &amp; RESTAURANT
  </text>
</svg>